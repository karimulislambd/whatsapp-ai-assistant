# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Secrets marked `sync: false` are prompted for on first deploy.
services:
  - type: web
    name: whatsapp-ai-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Render generates a random value; copy it into Meta's webhook "Verify token" field.
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      # Free instances have an ephemeral filesystem: memory resets on redeploy / spin-down.
      - key: DB_PATH
        value: data/assistant.db
