[project]
name = "whatsapp-ai-assistant"
version = "1.0.0"
description = "Multimodal WhatsApp AI assistant (text, voice, image) on the official Meta WhatsApp Cloud API + Groq."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Karimul Islam" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
